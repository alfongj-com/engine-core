name: twmq Tests

on:
  push:
    branches: [main]
    paths:
      - "twmq/**"
  pull_request:
    branches: [main]
    paths:
      - "twmq/**"
  workflow_dispatch: # Allow manual triggering for testing (optional)

env:
  CARGO_TERM_COLOR: always
  TEST_REDIS_URL: redis://127.0.0.1:6379/

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #checkout@v4

      - name: Install CI dependencies
        uses: taiki-e/install-action@9185c192a96ba09167ad8663015b3fbbf007ec79 #@2.56.2
        with:
          tool: cargo-nextest

      - name: Cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build -p twmq --verbose

      - name: Run tests
        run: cargo nextest run -p twmq --profile ci

      - name: Test Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: twmq-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
