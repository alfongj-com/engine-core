name: Formal verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formal-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Model runner safeguards
        run: python3 -m unittest discover -s formal -p 'test_*.py' -v
      - name: Exhaust protocol models and require specific counterexamples
        run: python3 formal/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protocol-model-results
          path: formal/results/
          if-no-files-found: error
  rust-fees:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned verifier
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Independent arithmetic reference examples
        run: cargo test --locked --manifest-path formal/fees/Cargo.toml
      - name: Prove production arithmetic and reject source mutations
        run: python3 formal/fees/check.py --timeout 600 --jobs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-fee-proof-results
          path: formal/fees/results/
          if-no-files-found: error
